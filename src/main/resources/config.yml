# Grafting configuration

# How many grafts a single player may keep alive at the same time.
max-active-grafts: 5

# How far away (blocks) right-click can tie the thread to what you are looking at.
tie-range: 48

# How long each kind of graft lasts before the thread unravels (seconds).
durations:
  distance: 120   # Place + Place      two places become one
  fate: 60        # Being + Being      harm meant for the first lands on the second
  nature: 90      # Place + Being      the being takes on the block's nature
  return: 300     # Being + Place      the being's next death becomes a trip home
  exchange: 60    # Being + Being      the two swap places, and again whenever the first is struck
  enmity: 60      # Being + Being      hostility toward the first is aimed at the second
  gravity: 20     # Being + Place      'down' points at the block
  puppet: 30      # Being + Being      the second mirrors the first's movements
  enemy: 20       # Being + Place      (Distance lv3) a being's next step lands on the block
  life: 300       # Being + Being      the first's life lives in the second
  location: 600   # Place + Place      two areas trade places until cut
  ability: 120    # Being + Being      your power (or a creature's) grafted onto a player
  storage: 1800   # Place + Being      a container becomes part of a player's inventory

# Gateway (Distance lv2) refuses to connect places farther apart than this at level 2,
# doubling with every distance level after. -1 = unlimited.
max-distance: 256

# Spirit: every ability costs some, once per use or every second it is held.
spirit:
  max: 1000
  regen-per-second: 8
  creative-free: false
  cost:               # once, when the graft is made
    step: 40
    gateway: 60
    enemy: 120
    infinity: 80      # to raise it
    spirit-body: 30   # to shift into it
    fate: 60
    nature: 40
    return: 120
    exchange: 50
    enmity: 50
    gravity: 60
    puppet: 70
    supernova: 300
    life: 400
    location: 250
    ability: 80
    storage: 120
  upkeep:             # every second while it holds
    infinity: 25
    infinity-per-damage: 15   # extra for every point of damage Infinity stops
    ability: 6

# Distance levels rise with blocks travelled through your own distance grafts (Step and Gateway).
distance:
  levels:             # total blocks needed to reach each level
    2: 500
    3: 2000
    4: 6000
  step-range: 500     # how far Step reaches at level 1, doubling every level
  enemy-range: 12     # how close a being must be for Enemy Step (grows with level)

# Location: the area moved around each end. radius 8 = a 17x17 area, about one chunk.
location:
  radius: 8
  depth: 4            # blocks below the anchor
  height: 12          # blocks above the anchor

# Chance that a Beyonder shakes off a graft (players only; set with /graft sequence).
resist:
  life:
    same-or-higher: 0.85
    lower: 0.30
  enemy:
    same-or-higher: 0.60
    lower: 0.20

# The spirit / distance readout above the hotbar.
hud:
  enabled: true
  always: false       # false = only while holding the thread, in Spirit Body, or regenerating

# Place + Anything: the death of a star grafted onto the target.
supernova:
  radius: 10          # blast radius in blocks
  max-damage: 30      # damage at the centre, falling off to 0 at the edge
  break-blocks: false # whether the detonation also destroys terrain

particles:
  # Multiplier for every particle effect. 0.5 = half, 2.0 = double (max 4.0).
  density: 1.0

# The pathway menu: open it by clicking the Fool sigil in your inventory.
pathway-menu:
  # Give every player the sigil and keep it in their inventory.
  sigil: true
  # Inventory slot it lives in: 0-8 hotbar, 9-35 storage (9 = top-left, next to the crafting grid).
  sigil-slot: 9

# The texture pack that gives every ability its own icon.
# By default the plugin hosts it itself on a small built-in web server.
resource-pack:
  enabled: true
  # Set custom-models to false to keep the plain string look without a pack.
  custom-models: true
  required: false
  port: 8164
  # Address players use to reach this server. Leave empty to use server-ip, or localhost.
  public-host: ""
  # Or host grafting-pack.zip yourself and put its URL here (port/public-host are then ignored).
  url: ""
