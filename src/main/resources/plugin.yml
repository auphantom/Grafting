name: Grafting
version: '${version}'
main: io.github.auphantom.grafting.GraftingPlugin
api-version: '1.21'
author: auphantom
description: "Reassembly / Grafting - the Attendant of Mysteries' power to connect concepts that should never touch."

commands:
  graft:
    description: Get the Thread of Grafting, switch abilities, list or sever your grafts.
    usage: /graft <give|mode|menu|list|sever|pack|help>
    permission: grafting.use

permissions:
  grafting.use:
    description: Use the Thread of Grafting and the /graft command.
    default: true
  grafting.give:
    description: Give the Thread of Grafting to yourself or others.
    default: op
