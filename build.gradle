plugins {
    id 'java'
}

group = 'io.github.auphantom'
version = '2.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Draws the ability icons and zips them into a resource pack (tools/PackGenerator.java).
// Java runs single-file programs straight from source, so no extra source set is needed.
def packDir = layout.buildDirectory.dir('pack')
def packJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
def generatePack = tasks.register('generatePack', Exec) {
    description = 'Generates the Grafting texture pack.'
    def source = file('tools/PackGenerator.java')
    inputs.file source
    outputs.dir packDir
    doFirst { packDir.get().asFile.mkdirs() }
    executable = packJava.get().executablePath.asFile.absolutePath
    args '-Djava.awt.headless=true', source.absolutePath,
            packDir.get().file('grafting-pack.zip').asFile.absolutePath,
            packDir.get().asFile.absolutePath
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    from(generatePack) {
        include 'grafting-pack.zip'
    }
}

jar {
    archiveFileName = "Grafting-${project.version}.jar"
}
