plugins {
    id 'java'
}

group = 'io.github.auphantom'
version = '2.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

// The texture-pack generator lives in its own source set: it is build tooling, not plugin code,
// and never ends up in the plugin jar (only the zip it produces does).
sourceSets {
    packgen {
        java.srcDir 'tools/packgen/src/main/java'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Draws every texture and zips the resource pack (see tools/packgen).
def packDir = layout.buildDirectory.dir('pack')
def generatePack = tasks.register('generatePack', JavaExec) {
    group = 'build'
    description = 'Generates the Grafting texture pack.'
    classpath = sourceSets.packgen.runtimeClasspath
    mainClass = 'io.github.auphantom.grafting.packgen.PackGenerator'
    jvmArgs '-Djava.awt.headless=true'
    outputs.dir packDir
    args packDir.get().file('grafting-pack.zip').asFile.absolutePath, packDir.get().asFile.absolutePath
}

// Regenerates the preview images used in the README.
tasks.register('updateDocs', Copy) {
    group = 'documentation'
    description = 'Copies the generated icon preview into docs/images.'
    dependsOn generatePack
    from(packDir) { include '*.png' }
    into 'docs/images'
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    from(generatePack) {
        include 'grafting-pack.zip'
    }
}

jar {
    archiveFileName = "Grafting-${project.version}.jar"
}
